# Releases this repository publishes, read by the gh-action-debian-repo engine
# (docs/reference.md, "Releases and aliases"). Overrides the engine's defaults.

# A single suite named `stable` (Suite = Codename = stable), as the repository
# was first published. The candy-tools are release-agnostic, so per-codename
# pools gain nothing, and moving to codenames + a `stable` alias would change
# the Release file's Codename, which every client's `apt update` refuses until
# it is run with --allow-releaseinfo-change.
DISTS="stable"
ALIASES=""
ARCHES="amd64 arm64"
