# Repository identity and landing page, read by the gh-action-debian-repo engine
# (docs/reference.md, "conf/site.conf"). Shell syntax: KEY="value", no spaces
# around '='. Every key is optional; unset ones are derived from the repository
# (REPO_URL = the Pages URL, GITHUB_URL = this repository).

# Pinned to the values the repository was first published with. REPO_NAME sets
# the Release file's Origin/Label and the served keyring/.sources file names;
# changing either Origin or Label makes every client's `apt update` refuse the
# repository until it is run with --allow-releaseinfo-change.
REPO_NAME="candy-tools"
APT_DESCRIPTION="candy-tools Debian repository"

# Landing page. SITE_TITLE defaults to REPO_NAME. Themes: violet (built in),
# amber, blue, rose, teal; try one with the engine's
# `make -f <engine>/Makefile serve THEME=teal`.
THEME="rose"
