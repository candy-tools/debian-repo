name: Publish APT repo

# A push to main that touches a package reference, a manually-added binary, or
# the repository config rebuilds the whole repo from packages/*.json + debs/ and
# publishes it to GitHub Pages, through the gh-action-debian-repo engine (a
# publish-only call: this repository is the collection its tools push to). The
# full set is reconstructed every run, so no app can clobber another's package.
#
# Signing uses the APT_SIGNING_KEY secret of the github-pages environment
# (`make key-to-repo REPO=candy-tools/debian-repo`), reached via secrets: inherit.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'debs/**'
      - 'conf/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    # keep the engine version in step with ENGINE_REF in the Makefile
    uses: andresbott/gh-action-debian-repo/.github/workflows/publish.yml@v1.0.0-rc.2
    secrets: inherit
